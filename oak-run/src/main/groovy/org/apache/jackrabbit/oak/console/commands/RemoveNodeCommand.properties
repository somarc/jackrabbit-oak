command.description=Removes a single node and its subtree from the JCR repository.
command.usage=remove-node <path>
command.help=Removes the specified node and all of its child nodes from the repository. Designed for targeted, immediate cleanup by JCR path. For safety, does not permit removal of root or top-level nodes.