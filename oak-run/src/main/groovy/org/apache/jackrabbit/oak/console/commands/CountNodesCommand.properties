# Description of the CountNodesCommand for oak-run console
command.description=Counts nodes and binaries in a SegmentStore (TarMK) repository, detects corruption (missing segments/blobs), and optionally analyzes affected paths with AEM-specific recovery recommendations.

# Usage syntax for the command
command.usage=[segment-binaries | datastore-binaries | deep] [analysis]

# Detailed help message displayed in the oak-run console
command.help=Counts nodes and binaries in a SegmentStore (TarMK) repository, detects corruption (missing segments/blobs), and optionally analyzes affected paths with AEM-specific recovery recommendations.\n\nSyntax: count-nodes [segment-binaries | datastore-binaries | deep] [analysis]\n\nBinary Reading Options (mutually exclusive):\n  segment-binaries   - Read only segment blobs (small, stored in TarMK segments)\n  datastore-binaries - Read only DataStore blobs (large, stored externally)\n  deep               - Read all blobs (segment + DataStore) - most comprehensive\n  (none)             - Skip binary reading entirely (fastest)\n\nOther Options:\n  analysis - Collects corrupted paths, groups them by type, and provides detailed recovery heuristics\n\nExamples:\n  count-nodes                      # Count nodes only, skip binary reading\n  count-nodes segment-binaries     # Count nodes + read segment blobs only\n  count-nodes datastore-binaries   # Count nodes + read DataStore blobs only\n  count-nodes deep                 # Count nodes + read all blobs (comprehensive)\n  count-nodes analysis             # Count nodes + analyze corrupted paths\n  count-nodes deep analysis        # Full diagnostics with analysis\n\nOutput:\n  - Console: Real-time progress, node/binary counts, corruption warnings, analysis results\n  - Log File: Detailed output in count-nodes-snfe-YYYYMMDD-HHMMSS.log with blob type classification\n\nNotes:\n  - SegmentStore (TarMK) only; not compatible with DocumentNodeStore (MongoDB)\n  - Uses bounded collections (MAX_PATHS=10,000) to prevent memory exhaustion\n  - Blob types are clearly labeled in output: (segment), (datastore), (datastore-node-level), (node-level)\n  - Ensure DataStore configuration (--fds-path, --azureblobds, --s3ds) is correct to avoid false positives