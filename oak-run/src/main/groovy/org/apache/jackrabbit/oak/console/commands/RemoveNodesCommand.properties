command.description=Removes multiple nodes and their subtrees from the JCR repository based on a provided input file.
command.usage=remove-nodes <input file> [dry-run] [debug]
command.help=Removes multiple nodes and their entire subtrees safely and efficiently, according to specified rules. Accepts a file of paths (or blob IDs, path pairs) as input, checks each path for type and safety, and performs removal with full audit logging. Supports dry-run simulation for non-destructive validation and debug mode for detailed analysis.