command.description=Removes multiple nodes and their subtrees from the JCR repository based on a provided input file.
command.usage=<input file> [dry-run] [debug]
command.help=Removes multiple nodes and their entire subtrees safely and efficiently, according to specified rules. Accepts a count-nodes log or verbose consistency-check output (the gccand file of datastore --check-consistency --verbose, or the [consistency] file of datastorecheck --consistency --verbose) as input, checks each path for type and safety, and performs removal with full audit logging. Supports dry-run simulation for non-destructive validation and debug mode for detailed analysis. "Missing segment" lines from count-nodes are logged, not removed; remove those paths with remove-node.