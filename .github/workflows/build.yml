name: Oak Segment Consensus

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consensus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit and package (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    env:
      MAVEN_OPTS: -Xmx1536m -XX:ActiveProcessorCount=2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Verify the product and its Oak dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          # The inherited parallel-stream fixture requires two common-pool workers.
          timeout --foreground 35m mvn -B -ntp \
            -pl oak-segment-consensus -am verify \
            -DskipITs -Dskip.deployment=true \
            -Doak.source.revision="$(git rev-parse HEAD)" \
            -Doak.source.dirty=false \
            '-Dtest.opts.memory=-Xmx768m -XX:ActiveProcessorCount=2 -Djava.util.concurrent.ForkJoinPool.common.parallelism=2'
      - name: Retain test and bundle-baseline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/baseline.xml
          if-no-files-found: warn
          retention-days: 14
